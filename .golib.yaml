schema_version: 1
tool_version: v1.0.7
tool_checksums_sha256: beb57df2dff76b4a0044af843398baecab55a3d420986d9be7c9b14ca88befef

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzDispatcher$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzRequestUnmarshal$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzResponseUnmarshal$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzErrorUnmarshal$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzIDRoundTrip$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzClientCorrelation$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzClientBatchCorrelation$'
        budget: 2s
        timeout: 2m
  - module: .
    gate: conformance
    steps:
      - type: go-test
        packages: ["."]
        run: '^TestSpecificationExamples$'
        count: 1
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: go-test
        packages: [./...]
        run: '^Example'
        count: 1
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
